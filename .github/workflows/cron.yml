# CDT Monitor 外部定时触发（方式二 · GitHub Actions）
# 每 5 分钟请求一次监控触发地址，Worker 内部按「监控间隔」防抖
name: cdt-monitor-trigger

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟（GitHub 免费账户最小间隔）
  workflow_dispatch: {}      # 支持在 Actions 页面手动触发

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monitor
        run: curl -sS -m 30 "https://cdt.dddde.de/__cron"
