name = "cdt-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# 阿里云凭据主密钥（AES-GCM 加密 AK/Secret 用），通过 Cloudflare Dashboard 的 Secret 设置
# 名称固定为 CDT_MASTER_KEY，值为 32 字节 base64（不要硬编码在此文件）
# 说明：代码只引用 env.CDT_MASTER_KEY，ID 与业务逻辑解耦
#
# 可选恢复密码：ADMIN_PASSWORD
#   - 忘记管理员密码时用它登录（登录成功后自动把 D1 密码同步为该值）
#   - 在 Dashboard → Worker → Settings → Variables and Secrets 添加
#   - 类型建议选 Secret；未配置时不会生效，不影响正常登录
#   - 注意：这里不要写具体值，避免密码进入仓库

# ─────────────────────────────────────────────────────────────
# D1 数据库绑定（wrangler ≥ 4.45 自动预置，无需写 database_id）
# deploy 时按 database_name 匹配云端现有资源（幂等，不会重建）
# 换库/建库全程在 Dashboard 操作即可，ID 不会写进仓库
# ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "cdt-monitor-db"

# ─────────────────────────────────────────────────────────────
# 监控调度：仅使用「外部 HTTP 触发」GET /__cron（携带 CRON_SECRET）
#
# ⚠️ 原生 Cron Trigger 已【彻底移除】，本文件不含 [triggers] 段，请勿添加。原因：
#    1) Cloudflare 免费版的 Cron Trigger 额度是【账号级 5 个】，本项目用不上它，
#       留给账号上其他 Worker，也避免 error 10072（额度用尽）导致 deploy 整体失败；
#    2) Free 计划 CPU 仅 10ms/请求，scheduled 事件同样计费，外部触发更省；
#    3) src/index.ts 的 scheduled() 出口已删除，重新加 [triggers] 会报错
#       "The script has no scheduled handler"。
#
# 调度请交给外部服务：GitHub Actions、自建驱动（selfhost）、cron-job.org、
# 腾讯云 SCF / 阿里云 FC 等，开关见管理台「监控触发源」。
# 详见 DEPLOY-CRON.md。
# ─────────────────────────────────────────────────────────────

[observability]
enabled = true
