name = "cdt-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# 阿里云凭据主密钥（AES-GCM 加密 AK/Secret 用），通过 Cloudflare Dashboard 的 Secret 设置
# 名称固定为 CDT_MASTER_KEY，值为 32 字节 base64（不要硬编码在此文件）
# 说明：代码只引用 env.CDT_MASTER_KEY，ID 与业务逻辑解耦
#
# 可选恢复密码：ADMIN_PASSWORD
#   - 忘记管理员密码时用它登录（登录成功后自动把 D1 密码同步为该值）
#   - 在 Dashboard → Worker → Settings → Variables and Secrets 添加
#   - 类型建议选 Secret；未配置时不会生效，不影响正常登录
#   - 注意：这里不要写具体值，避免密码进入仓库

# ─────────────────────────────────────────────────────────────
# D1 数据库绑定（wrangler ≥ 4.45 自动预置，无需写 database_id）
# deploy 时按 database_name 匹配云端现有资源（幂等，不会重建）
# 换库/建库全程在 Dashboard 操作即可，ID 不会写进仓库
# ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "cdt-monitor-db"

# ─────────────────────────────────────────────────────────────
# 监控调度：Cloudflare 原生 Cron Trigger + 外部 HTTP 触发（GET /__cron，携带 CRON_SECRET）
#
# crons 固定每 5 分钟调用一次 scheduled()。注意 Cloudflare 的 cron 表达式【不能运行时修改】，
# 想改触发频率必须改这里并重新部署。
#
# 「实际多久跑一次监控」由管理台「监控触发源 → 监控间隔」控制：CF 每 5 分钟叫一次，
# 不足间隔的轮次在 scheduled() 内直接跳过（不跑阿里云 API，也不写 trigger_seen，
# 以免掩盖断档告警）。改间隔即时生效，无需重新部署。
#
# 额度：Free 计划的 Cron Trigger 是【账号级 5 个】（Paid 为 250），本项目占用 1 个。
# 若 deploy 报 error 10072，说明账号额度用尽，需删掉本段与其他 Worker 的 cron。
#
# 若 Dashboard → Worker → Triggers 页存在【手工创建】的 cron 条目，wrangler 无法管理它，
# 请在 Dashboard 删除后再 deploy，避免残留条目因缺少 scheduled 处理函数而失败。
# ─────────────────────────────────────────────────────────────

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
